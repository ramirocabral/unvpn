[package]
name = "cpvpn"
version = "0.1.0"
edition = "2021"
description = "Native Linux Check Point VPN client (reverse-engineered CCC/IKE)."

[dependencies]
native-tls = "0.2.12"
openssl = "0.10"
libc = "0.2"

[features]
# Statically link OpenSSL (built from source) for a distro-agnostic binary.
# Dev builds stay fast on the system OpenSSL; release/packaging uses this.
# NOTE: the AnyConnect DTLS fast-path links libgnutls dynamically (for
# gnutls_session_set_premaster); a fully-static build would need gnutls handled too
# (follow-up: feature-gate the DTLS path). CSTP/TCP works without gnutls.
vendored = ["openssl/vendored", "native-tls/vendored"]

[[bin]]
name = "cpvpn"
path = "src/main.rs"
