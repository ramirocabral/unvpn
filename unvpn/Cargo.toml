[package]
name = "unvpn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Linux multi-vendor VPN client engine (Check Point / Fortinet / F5 / AnyConnect / GlobalProtect / OpenVPN, plus kernel WireGuard)."

[dependencies]
openssl = "0.10"
openssl-probe = "0.2"
libc = "0.2"
unvpn-profiles.workspace = true

[features]
# Statically link OpenSSL (built from source) for a distro-agnostic binary.
# Dev builds stay fast on the system OpenSSL; release/packaging uses this.
# The AnyConnect DTLS fast-path uses libgnutls, but loads it at RUNTIME via dlopen
# (see anyconnect/dtls.rs) — no link-time dependency — so a single binary still runs
# on any distro: DTLS where libgnutls is present, CSTP everywhere else.
vendored = ["openssl/vendored", "unvpn-profiles/vendored"]

[[bin]]
name = "unvpn"
path = "src/main.rs"
