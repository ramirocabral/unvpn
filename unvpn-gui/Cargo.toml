[package]
name = "unvpn-gui"
version = "0.2.0"
edition = "2021"
description = "Native Linux VPN client GUI (Check Point / Fortinet / F5 / AnyConnect / GlobalProtect / OpenVPN / WireGuard) — GTK4 + libadwaita, with connection profiles."

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
# 0.3: `MENU_ON_ACTIVATE` (ItemIsMenu) — a left click opens the profile menu.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
dbus = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Embedded browser for AnyConnect SAML (needs webkitgtk-6.0). Without it the SSO
# login opens in the default browser and the token cookie is pasted by hand.
webkit6 = { version = "0.6", optional = true }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[features]
default = ["webview"]
webview = ["dep:webkit6"]

[[bin]]
name = "unvpn-gui"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
