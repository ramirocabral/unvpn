[package]
name = "unvpn-profiles"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "unvpn connection profiles (the profiles.toml model, their keyring secrets and the engine command line each one maps to), plus the engine's output markers and control socket shared with its front-ends."

[dependencies]
serde.workspace = true
toml.workspace = true
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
# Build libdbus from source (for the statically linked engine).
vendored = ["keyring/vendored"]
