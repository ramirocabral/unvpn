name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libdbus-1-dev \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p unvpn-gui --no-default-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Static engine build
        run: cargo build --release -p unvpn --features vendored

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz each target for a minute
        run: |
          for t in http ppp ikev1 ikev2 ccc der xml tunnel_config; do
            mkdir -p fuzz/corpus/$t
            cargo fuzz run $t fuzz/corpus/$t fuzz/seeds/$t -- -max_total_time=60
          done
